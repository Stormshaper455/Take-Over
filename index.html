<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take Over</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="station">
    <section class="laptop-screen" aria-label="Take Over laptop">
      <div class="camera"></div>
      <div class="screenBG" id="game-screen" aria-label="Game interface">
        <div class="hub-container">
          <div class="hubBG">
            <div class="hub-content">
              <section class="takeover" aria-labelledby="takeover-title">
                <h1 id="takeover-title" class="takeover-title">Takeover meter</h1>
                <div class="takeover-meter" role="meter" aria-label="Takeover level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <svg class="takeover-ring" viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="takeover-track" cx="60" cy="60" r="52" />
                    <circle class="takeover-fill" cx="60" cy="60" r="52" pathLength="100" />
                  </svg>
                  <span class="takeover-value" aria-hidden="true">0%</span>
                </div>
                <p class="takeover-status" role="status">System secure</p>
              </section>
            </div>
          </div>
        </div>
        
        <div class="dock-container">
          <div class="dock"></div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
